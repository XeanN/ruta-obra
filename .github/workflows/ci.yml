name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    name: data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jsonschema openpyxl
      - run: python scripts/validate_data.py
      - run: python scripts/simulate.py
      - name: resultados-motor.json al día (paridad con el motor TS)
        run: |
          python scripts/simulate.py --export
          git diff --exit-code fixtures/resultados-motor.json || {
            echo "::error::Corre 'python scripts/simulate.py --export' y sube fixtures/resultados-motor.json"
            exit 1
          }

  app:
    name: app
    runs-on: ubuntu-latest
    # Valores de prueba: el build y el E2E (modo invitado) no se conectan a ninguna base real.
    # Los tests de base de datos usan PGlite (Postgres en memoria) con las migraciones de drizzle/.
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      BETTER_AUTH_SECRET: ci-solo-pruebas-no-es-un-secreto-real-0000
      BETTER_AUTH_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
